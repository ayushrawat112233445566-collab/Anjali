<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coded Flowers For You 🌸</title>
  <style>
    /* Reset & Base Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0c1b 0%, #080309 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Canvas for Background Particles */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Container for Flowers & Ground */
    .garden-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    /* Dark Ground Base */
    .ground {
      position: absolute;
      bottom: -30px;
      width: 120%;
      height: 120px;
      background: radial-gradient(ellipse at center, #1a381e 0%, #051207 70%, transparent 100%);
      border-radius: 50%;
      filter: blur(10px);
      z-index: 2;
    }

    /* SVG Flower Layer */
    .flower-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 3;
    }

    /* Stem Animations using Stroke Dashoffset */
    .stem {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: growStem 3s ease-out forwards;
    }

    @keyframes growStem {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Leaf Scale Animation */
    .leaf {
      transform-origin: center;
      transform: scale(0);
      animation: growLeaf 1.5s ease-out forwards;
      animation-delay: 1.8s;
    }

    @keyframes growLeaf {
      to {
        transform: scale(1);
      }
    }

    /* Flower Bloom & Glow Animation */
    .flower-head {
      transform-origin: center;
      transform: scale(0);
      animation: bloom 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.6));
    }

    .flower-1 { animation-delay: 2.2s; }
    .flower-2 { animation-delay: 2.6s; }
    .flower-3 { animation-delay: 3.0s; }
    .flower-4 { animation-delay: 3.4s; }

    @keyframes bloom {
      0% {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Floating Text Badges / Love Notes */
    .badge {
      position: absolute;
      padding: 10px 20px;
      background: rgba(180, 40, 60, 0.75);
      border: 1px solid rgba(255, 182, 193, 0.5);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 25px;
      box-shadow: 0 0 20px rgba(255, 75, 110, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(20px) scale(0.8);
      animation: popup 0.8s ease-out forwards;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    /* Badge Positions & Delays */
    .badge-1 { top: 20%; left: 10%; animation-delay: 3.8s; }
    .badge-2 { top: 35%; left: 5%; animation-delay: 4.2s; }
    .badge-3 { top: 27%; right: 10%; animation-delay: 4.6s; }
    .badge-4 { top: 42%; right: 8%; animation-delay: 5.0s; }
    .badge-center { top: 50%; left: 50%; transform: translateX(-50%) translateY(20px) scale(0.8); animation: popupCenter 0.8s ease-out forwards; animation-delay: 5.4s; }

    @keyframes popup {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes popupCenter {
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    /* Soft Breathing Glow Effect for Badges */
    .badge:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
    }
  </style>
</head>
<body>

  <!-- Floating Glowing Particles Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Garden Container -->
  <div class="garden-container">
    <div class="ground"></div>

    <!-- Interactive Love Note Badges -->
    <div class="badge badge-1">You are my favorite person 💕</div>
    <div class="badge badge-2">You make my world brighter ✨</div>
    <div class="badge badge-3">I'm lucky to have you 🌸</div>
    <div class="badge badge-4">Every flower reminds me of you 🌷</div>
    <div class="badge badge-center">Forever grateful for you 🎵</div>

    <!-- Vector Flowers & Stems SVG -->
    <svg class="flower-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax meet">
      <defs>
        <!-- Gradients for Stems & Leaves -->
        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#0a3212" />
          <stop offset="100%" stop-color="#2e8b57" />
        </linearGradient>

        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3cb371" />
          <stop offset="100%" stop-color="#145223" />
        </linearGradient>

        <!-- Gradients for Flower Petals -->
        <radialGradient id="petalRed" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff4d6d" />
          <stop offset="70%" stop-color="#c9184a" />
          <stop offset="100%" stop-color="#800f2f" />
        </radialGradient>

        <radialGradient id="petalOrange" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb703" />
          <stop offset="70%" stop-color="#fb8500" />
          <stop offset="100%" stop-color="#d00000" />
        </radialGradient>

        <radialGradient id="centerYellow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff3b0" />
          <stop offset="100%" stop-color="#e0a96d" />
        </radialGradient>

        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- STEMS -->
      <!-- Center Main Stem -->
      <path class="stem" d="M 400 580 Q 390 380 400 220" stroke="url(#stemGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Left Stem 1 -->
      <path class="stem" d="M 390 580 Q 310 400 280 260" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
      
      <!-- Far Left Stem 2 -->
      <path class="stem" d="M 380 580 Q 220 450 180 340" stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>

      <!-- Right Stem 1 -->
      <path class="stem" d="M 410 580 Q 490 400 520 270" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>

      <!-- Far Right Stem 2 -->
      <path class="stem" d="M 420 580 Q 580 460 620 350" stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>


      <!-- LEAVES -->
      <g class="leaf" style="transform-origin: 360px 420px;">
        <path d="M 385 430 Q 300 400 330 450 Q 380 440 385 430 Z" fill="url(#leafGrad)"/>
      </g>
      <g class="leaf" style="transform-origin: 430px 400px;">
        <path d="M 410 410 Q 490 380 460 430 Q 415 420 410 410 Z" fill="url(#leafGrad)"/>
      </g>
      <g class="leaf" style="transform-origin: 290px 360px;">
        <path d="M 300 370 Q 220 330 250 390 Q 295 380 300 370 Z" fill="url(#leafGrad)"/>
      </g>
      <g class="leaf" style="transform-origin: 510px 370px;">
        <path d="M 500 380 Q 580 340 550 400 Q 505 390 500 380 Z" fill="url(#leafGrad)"/>
      </g>


      <!-- FLOWER HEADS -->

      <!-- 1. Center Tall Flower (Red Glow) -->
      <g class="flower-head flower-1" style="transform-origin: 400px 220px;" filter="url(#glow)">
        <!-- Petals -->
        <path d="M 400 220 C 370 170 340 210 370 240 Z" fill="url(#petalRed)"/>
        <path d="M 400 220 C 430 170 460 210 430 240 Z" fill="url(#petalRed)"/>
        <path d="M 400 220 C 350 250 380 280 400 240 Z" fill="url(#petalRed)"/>
        <path d="M 400 220 C 450 250 420 280 400 240 Z" fill="url(#petalRed)"/>
        <path d="M 400 220 C 380 150 420 150 400 220 Z" fill="url(#petalOrange)"/>
        <!-- Center Pistil -->
        <circle cx="400" cy="220" r="14" fill="url(#centerYellow)" />
      </g>

      <!-- 2. Mid Left Flower (Warm Orange) -->
      <g class="flower-head flower-2" style="transform-origin: 280px 260px;" filter="url(#glow)">
        <path d="M 280 260 C 250 210 220 250 250 280 Z" fill="url(#petalOrange)"/>
        <path d="M 280 260 C 310 210 340 250 310 280 Z" fill="url(#petalOrange)"/>
        <path d="M 280 260 C 240 290 270 320 280 280 Z" fill="url(#petalOrange)"/>
        <path d="M 280 260 C 320 290 290 320 280 280 Z" fill="url(#petalOrange)"/>
        <circle cx="280" cy="260" r="12" fill="url(#centerYellow)"/>
      </g>

      <!-- 3. Mid Right Flower (Red Warm) -->
      <g class="flower-head flower-3" style="transform-origin: 520px 270px;" filter="url(#glow)">
        <path d="M 520 270 C 490 220 460 260 490 290 Z" fill="url(#petalRed)"/>
        <path d="M 520 270 C 550 220 580 260 550 290 Z" fill="url(#petalRed)"/>
        <path d="M 520 270 C 480 300 510 330 520 290 Z" fill="url(#petalRed)"/>
        <path d="M 520 270 C 560 300 530 330 520 290 Z" fill="url(#petalRed)"/>
        <circle cx="520" cy="270" r="12" fill="url(#centerYellow)"/>
      </g>

      <!-- 4. Far Left Small Flower -->
      <g class="flower-head flower-4" style="transform-origin: 180px 340px;" filter="url(#glow)">
        <circle cx="180" cy="320" r="12" fill="url(#petalOrange)"/>
        <circle cx="160" cy="340" r="12" fill="url(#petalOrange)"/>
        <circle cx="200" cy="340" r="12" fill="url(#petalOrange)"/>
        <circle cx="180" cy="360" r="12" fill="url(#petalOrange)"/>
        <circle cx="180" cy="340" r="9" fill="url(#centerYellow)"/>
      </g>

      <!-- 5. Far Right Small Flower -->
      <g class="flower-head flower-4" style="transform-origin: 620px 350px;" filter="url(#glow)">
        <circle cx="620" cy="330" r="12" fill="url(#petalRed)"/>
        <circle cx="600" cy="350" r="12" fill="url(#petalRed)"/>
        <circle cx="640" cy="350" r="12" fill="url(#petalRed)"/>
        <circle cx="620" cy="370" r="12" fill="url(#petalRed)"/>
        <circle cx="620" cy="350" r="9" fill="url(#centerYellow)"/>
      </g>
    </svg>
  </div>

  <!-- JavaScript for Floating Background Lights / Fireflies -->
  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let particlesArray = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.speedY = -Math.random() * 0.8 - 0.2;
        this.opacity = Math.random() * 0.8 + 0.2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.fillStyle = `rgba(255, 182, 193, ${this.opacity})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff69b4';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < 60; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();
  </script>
</body>
</html>
